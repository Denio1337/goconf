app_name: YAMLServiceApp
debug: false

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 30s

database:
  host: db.yaml.internal
  port: 5432
  user: appuser
  password: yaml-secret-password
  max_conns: 40

allowed_origins:
  - https://frontend.domain
  - https://admin.domain
